<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria UTN</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/admin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <header id="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <h1 class="h3 mb-0">Pizzeria UTN</h1>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav nav-menu">
                        <!-- dinamicamente insertamos los links de navegacion segun el rol del usuario -->
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <!-- seccion login -->
        <section class="py-5 section" id="loginSection">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-6 col-lg-4">
                        <h2 class="text-center mb-4">Iniciar sesión</h2>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña:</label>
                                <input type="password" class="form-control" id="password"
                                    placeholder="Ingresa tu contraseña" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                            <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="#"
                                    class="text-decoration-none">Regístrate</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <!-- seccion de registro, la cual permanecerá oculta hasta que el usuario decida registrarse -->
        <!-- cada seccion permanecerá oculta hasta que el usuario realice la accion necesaria -->
        <section class="section hidden" id="registerSection">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-6 col-lg-4">
                        <h2 class="text-center mb-4">Registrarse</h2>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="registerName" class="form-label">Nombre:</label>
                                <input type="text" class="form-control" id="registerName" placeholder="Ingresa tu nombre"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="registerEmail" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="registerEmail" placeholder="ejemplo@correo.com"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="registerPassword" class="form-label">Contraseña:</label>
                                <input type="password" class="form-control" id="registerPassword"
                                    placeholder="Ingresa tu contraseña" required>
                            </div>
                            <div class="mb-3">
                                <label for="registerPasswordConfirm" class="form-label">Confirmar Contraseña:</label>
                                <input type="password" class="form-control" id="registerPasswordConfirm"
                                    placeholder="Confirma tu contraseña" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <!-- seccion de menu, la cual se mostrará al usuario logueado -->
        <section class="section hidden" id="menuSection">
            <div class="container text-center">
                <h2>Menú</h2>
                <div id="menuGrid" class="menu-grid">
                    <!-- insertaremos dinamicamente el menú -->
                </div>
            </div>
        </section>

        <!-- seccion carrito -->
        <section>
            <div class="section hidden" id="cartSection">
                <div class="container text-center">
                    <h2>Mi pedido</h2>
                    <div id="cartItems" class="mb-3 cart-items">
                        <!-- los items del carrito se insertarán dinamicamente -->
                    </div>
                    <h4 id="cartTotal">Total: $0.00</h4>
                    <button id="checkoutButton" class="btn btn-success">Finalizar Compra</button>
                </div>
            </div>
        </section>

        <!-- seccion pedidos del usuario -->
        <section>
            <div id="userOrdersSection" class="section hidden">
                <div class="container text-center">
                    <h2>Mis Pedidos</h2>
                    <div id="userOrdersList">
                        <!-- historial de pedidos del usuario-->
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
